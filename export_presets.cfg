; Export presets for Madraspuram
; NOTE: Requires Godot 4.7.x export templates installed.

[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features="demo"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
threads/emscripten_pool_size=8
threads/godot_pool_size=4

[preset.1]

name="Desktop"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/desktop/Madraspuram.app"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
application/icon=""
application/icon_interpolation=4
application/bundle_identifier="com.madraspuram.demo"
application/signature=""
application/app_category="Games"
application/short_version="0.1.0"
application/version="0.1.0"
display/high_res=true
